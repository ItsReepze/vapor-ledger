<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vapor Ledger test page</title>
  <style>body { background: #1b2838; color: #fff; font-family: Arial; }</style>
</head>
<body>
  <!-- A fake Steam store page for testing without a Steam account.
       Open it through a local web server, for example: npx serve . -->
  <div id="global_action_menu"></div>
  <div id="application_config"
       data-userinfo='{"steamid":"76561190000000000","country_code":"DE"}'
       data-store_user_config='{"webapi_token":"fake-token"}'></div>
  <p>Fake store page. Click "Vapor Ledger" at the top.</p>

  <script>
    // Fake chrome.storage, so the cache works outside an extension.
    const store = {};
    window.chrome = { storage: { local: {
      get: async (key) => ({ [key]: store[key] }),
      set: async (obj) => Object.assign(store, obj),
      remove: async (key) => { delete store[key]; },
    } } };

    const games = [
      ["Hades", 2400, 1730000000], ["Portal 2", 0, 0], ["Stardew Valley", 9000, 1760000000],
      ["Cyberpunk 2077", 25, 1700000000], ["Hollow Knight", 0, 0], ["DOOM Eternal", 1500, 1690000000],
      ["Disco Elysium", 45, 1650000000], ["Counter-Strike 2", 52000, 1762000000],
    ].map(([name, minutes, last], i) => ({ appid: i + 1, name, playtime_forever: minutes, rtime_last_played: last }));

    const row = (date, items, type, total, wallet, payment) => `
      <tr class="wallet_table_row">
        <td class="wht_date">${date}</td>
        <td class="wht_items">${items.map((i) => `<div>${i}</div>`).join("")}</td>
        <td class="wht_type"><div>${type}</div><div class="wth_payment">${payment || "Wallet"}</div></td>
        <td class="wht_total">${total}</td>
        <td class="wht_wallet_change">${wallet || ""}</td>
      </tr>`;

    const page1 = `<html><body><table>
      ${row("4. Nov. 2026", ["Cyberpunk 2077"], "Kauf", "29,99€", "", "Geschenkkarte")}
      ${row("2. Nov. 2026", ["Steam Wallet Code"], "Wallet Code Redemption", "50,00€", "+50,00€")}
      ${row("1. Okt. 2026", ["Steam Community Market"], "Markttransaktion", "", "+1,20€")}
      ${row("12. März 2025", ["Hades"], "Kauf", "24,99€")}
      ${row("12. März 2025", ["Hades"], "Rückerstattung", "24,99€")}
      </table>
      <script>var g_historyCursor = {"wallet_txnid":"123","timestamp_newest":1700000000,"balance":"0","currency":3};<\/script>
      </body></html>`;
    const page2 = row("3. Jan. 2024", ["Hades"], "Kauf", "19,99€")
      + row("24. Dez. 2023", ["Disco Elysium", "Hollow Knight"], "Kauf", "32,50€")
      + row("1. Juli 2022", ["Stardew Valley"], "Geschenkkauf", "13,99€")
      + row("5. Juli 2022", ["20,00€ Steam-Guthaben"], "Kauf", "20,00€")
      + row("2. Mai 2021", ["DOOM Eternal"], "Kauf", "59,99€");

    document.cookie = "sessionid=fake-session";
    window.requests = [];
    window.fetch = async (url, options) => {
      window.requests.push({ url: String(url), method: (options && options.method) || "GET",
        body: options && options.body ? String(options.body) : "" });
      await new Promise((r) => setTimeout(r, 100));
      if (String(url).includes("GetOwnedGames")) {
        return new Response(JSON.stringify({ response: { game_count: games.length, games } }));
      }
      if (String(url).endsWith("/account/history/")) return new Response(page1);
      if (String(url).includes("AjaxLoadMoreHistory")) {
        return new Response(JSON.stringify({ success: 1, html: page2 }));
      }
      return new Response("not found", { status: 404 });
    };
  </script>
  <script src="../src/lib/util.js"></script>
  <script src="../src/lib/history.js"></script>
  <script src="../src/lib/steam.js"></script>
  <script src="../src/lib/stats.js"></script>
  <script src="../src/lib/cache.js"></script>
  <script src="../src/content/styles.js"></script>
  <script src="../src/content/dashboard.js"></script>
  <script src="../src/content/main.js"></script>
</body>
</html>
