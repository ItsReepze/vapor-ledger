<!DOCTYPE html>
<!-- Made up copy of steamcommunity.com/id/<name>/edit/info, as Steam's page
     builds it. Class names follow Steam's pattern (name plus a random
     suffix), all names and values are invented. -->
<html class=" responsive" lang="en">
<head><meta charset="utf-8"><title>Steam Community :: Edit Profile</title></head>
<body class="flat_page responsive_page">
<div id="application_root">
	<div class="profileeditshell_Shell_2kqKZ">
		<div class="profileeditshell_Navigation_33kYb">
			<a href="/id/made_up_name/edit/info" class="profileeditshell_NavLink_3tXkl Active">General</a>
			<a href="/id/made_up_name/edit/avatar" class="profileeditshell_NavLink_3tXkl">Avatar</a>
		</div>
		<div class="profileeditshell_PageContent_23XE6">
			<div class="profileedit_ProfileBoxContent_3s6BB">
				<div class="DialogInput_Wrapper">
					<label class="DialogLabel">Profile Name</label>
					<input type="text" class="DialogInput DialogTextInputBase" name="personaName" value="Made Up" maxlength="32">
				</div>
				<div class="DialogInput_Wrapper">
					<label class="DialogLabel">Custom URL</label>
					<input type="text" class="DialogInput DialogTextInputBase" name="customURL" value="made_up_name">
				</div>
				<div class="DialogInput_Wrapper">
					<label class="DialogLabel">Summary</label>
					<textarea class="DialogTextInputBase">No information given.</textarea>
				</div>
			</div>
			<div class="profileedit_SaveCancelButtons_2KJ8a">
				<button type="submit" class="DialogButton _DialogLayout Primary">Save</button>
				<button type="button" class="DialogButton _DialogLayout Secondary">Cancel</button>
			</div>
		</div>
	</div>
</div>
</body>
</html>
